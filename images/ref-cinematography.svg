<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="600"
  viewBox="0 0 960 600"
  role="img"
  aria-labelledby="t d"
>
  <title id="t">The director’s visual reference</title>
  <desc id="d">
    16:9 cinema frame, 9:16 vertical frame and 2.39:1 anamorphic frame. Camera
    axes show forward dolly, upward crane and rotational pan. Nested frames
    illustrate wide, medium and close-up coverage.
  </desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#202838" stroke-width="1" />
    </pattern>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="m0 0 10 5-10 5Z" fill="#00c2ff" />
    </marker>
  </defs>
  <rect width="960" height="600" rx="16" fill="#0b0f18" />
  <rect width="960" height="600" fill="url(#grid)" />
  <g font-family="system-ui,sans-serif">
    <text x="36" y="48" fill="#e5a93c" font-size="15" letter-spacing="3">
      FRAME WITH INTENTION
    </text>
    <text x="36" y="80" fill="#a4afc2" font-size="14">
      Composition defines what the audience feels first.
    </text>
    <g fill="#111520" stroke="#e5a93c" stroke-width="2">
      <rect x="36" y="118" width="288" height="162" rx="4" />
      <rect x="410" y="110" width="96" height="171" rx="4" />
      <rect x="572" y="160" width="352" height="147.28" rx="4" />
    </g>
    <g stroke="#e5a93c" opacity=".25">
      <path
        d="M132 118v162m96-162v162M36 172h288M36 226h288M442 110v171m32-171v171M410 167h96m-96 57h96M689 160v147m118-147v147M572 209h352m-352 49h352"
      />
    </g>
    <g fill="#f2f3f7" font-size="16">
      <text x="150" y="209">16:9</text>
      <text x="439" y="202">9:16</text>
      <text x="723" y="242">2.39:1</text>
    </g>
    <g fill="#a4afc2" font-size="13">
      <text x="36" y="309">CINEMA / AWARD FORMAT</text>
      <text x="382" y="309">VERTICAL SOCIAL</text>
      <text x="572" y="337">ANAMORPHIC LOOK · NOT EXACTLY 21:9</text>
    </g>
    <path d="M36 365h888" stroke="#303849" />
    <text x="36" y="402" fill="#e5a93c" font-size="13" letter-spacing="2">
      CAMERA AXES
    </text>
    <g stroke="#00c2ff" fill="none" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M135 526 244 483" />
      <path d="M135 526V438" />
      <path d="M65 506c-15-72 154-80 152-13" />
    </g>
    <path
      d="M110 500h40v36h-40Zm40 8 21-12v43l-21-12"
      fill="#111520"
      stroke="#e5a93c"
      stroke-width="2"
    />
    <g fill="#a4afc2" font-size="12">
      <text x="170" y="550">DOLLY / Z</text>
      <text x="145" y="446">CRANE / Y</text>
      <text x="38" y="474">PAN</text>
    </g>
    <text x="382" y="402" fill="#e5a93c" font-size="13" letter-spacing="2">
      FRAME THE PERFORMANCE
    </text>
    <g fill="none" stroke="#a4afc2">
      <rect x="385" y="424" width="250" height="140" />
      <rect x="455" y="437" width="115" height="127" stroke="#00c2ff" />
      <rect x="484" y="447" width="57" height="67" stroke="#e5a93c" />
    </g>
    <circle cx="513" cy="474" r="20" fill="#303849" />
    <path d="M479 560v-34q34-24 68 0v34" fill="#303849" />
    <g fill="#a4afc2" font-size="13">
      <text x="670" y="449">WIDE · space &amp; context</text>
      <text x="670" y="485" fill="#00c2ff">MCU · character &amp; gesture</text>
      <text x="670" y="521" fill="#e5a93c">CU · emotion &amp; detail</text>
    </g>
    <text x="36" y="585" fill="#a4afc2" font-size="11">
      A PLANNING GUIDE, NOT A MODEL CAPABILITY GUARANTEE · SEEDANCE DIRECTOR
      STUDIO
    </text>
  </g>
</svg>
